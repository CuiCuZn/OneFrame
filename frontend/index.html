<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="一格 OneFrame · 一个入口，所有图像与视频模型" />
    <title>一格 · OneFrame</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("of.theme") || "auto";
          var light =
            mode === "light" ||
            (mode === "auto" && window.matchMedia("(prefers-color-scheme: light)").matches);
          var root = document.documentElement;
          root.dataset.theme = light ? "light" : "dark";
          root.style.colorScheme = light ? "light" : "dark";
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", light ? "light" : "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
